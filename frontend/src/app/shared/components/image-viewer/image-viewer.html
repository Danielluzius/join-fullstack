<div class="viewer-overlay" role="dialog" aria-modal="true" aria-label="Image viewer" (click)="closeViewer.emit()">
    <div class="viewer-container" (click)="$event.stopPropagation()">

        <header class="viewer-header">
            <span class="viewer-meta" aria-live="polite">
                {{ current.name }} / {{ formatSize(current.size) }}
            </span>

            <div class="viewer-zoom-controls">
                <button type="button" class="viewer-btn" (click)="zoomOut()" aria-label="Zoom out">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
                        <path d="M21 21l-4.35-4.35M8 11h6" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </button>
                <button type="button" class="viewer-btn" (click)="zoomIn()" aria-label="Zoom in">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
                        <path d="M21 21l-4.35-4.35M11 8v6M8 11h6" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </button>
            </div>

            <div class="viewer-actions">
                <button type="button" class="viewer-btn" (click)="download()" aria-label="Download image">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M12 3v13M7 11l5 5 5-5M3 21h18" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <button type="button" class="viewer-btn" (click)="closeViewer.emit()" aria-label="Close viewer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="viewer-image-wrapper">
            @if (attachments.length > 1) {
            <button type="button" class="nav-btn nav-prev" (click)="prev()" aria-label="Previous image">&#8592;</button>
            }

            <img [src]="current.base64" [alt]="current.name" class="viewer-image"
                [style.transform]="'scale(' + zoomLevel + ')'" />

            @if (attachments.length > 1) {
            <button type="button" class="nav-btn nav-next" (click)="next()" aria-label="Next image">&#8594;</button>
            }
        </div>

        <footer class="viewer-footer">
            <span class="viewer-counter" aria-live="polite">
                {{ startIndex + 1 }} / {{ attachments.length }}
            </span>
            <span class="viewer-type">{{ current.type }}</span>
        </footer>

    </div>
</div>
